services:
  - type: web
    name: label-police-api
    env: python
    rootDir: backend
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      # Multi-key Gemini support (comma-separated)
      - key: GEMINI_API_KEYS
        sync: false
      # Legacy single key (deprecated, use GEMINI_API_KEYS)
      - key: GEMINI_API_KEY
        sync: false
      # OpenRouter fallback layer (optional)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
